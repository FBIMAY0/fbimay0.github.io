<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 - 我们将很快回来</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #3a7bd5, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            width: 90%;
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .maintenance-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #4dabf7;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .gear {
            animation: spin 6s linear infinite;
        }
        
        .gear:nth-child(2) {
            animation: spin-reverse 8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        p {
            font-size: 1.3rem;
            line-height: 1.7;
            margin-bottom: 30px;
            color: #e9ecef;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .highlight {
            color: #4dabf7;
            font-weight: bold;
        }
        
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 40px 0;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .progress-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #4dabf7, #3a7bd5);
            border-radius: 10px;
            animation: progressPulse 2s infinite;
            position: relative;
        }
        
        @keyframes progressPulse {
            0% { box-shadow: 0 0 0 0 rgba(77, 171, 247, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(77, 171, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(77, 171, 247, 0); }
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }
        
        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            min-width: 80px;
        }
        
        .countdown-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4dabf7;
        }
        
        .countdown-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
        }
        
        .contact-info h2 {
            margin-bottom: 20px;
            color: #4dabf7;
        }
        
        .contact-details {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-icon:hover {
            background: #4dabf7;
            transform: translateY(-5px);
        }
        
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .notification {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .notification-dot {
            width: 10px;
            height: 10px;
            background: #4dabf7;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1.1rem;
            }
            
            .countdown {
                gap: 10px;
            }
            
            .countdown-item {
                min-width: 60px;
                padding: 10px;
            }
            
            .countdown-number {
                font-size: 1.8rem;
            }
            
            .contact-details {
                flex-direction: column;
                gap: 15px;
            }
            
            .maintenance-icon {
                font-size: 3.5rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .countdown-item {
                min-width: 50px;
            }
            
            .countdown-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="logo">
        <i class="fas fa-cube"></i>
        <span>TechCorp</span>
    </div>
    
    <div class="notification">
        <div class="notification-dot"></div>
        <span>维护进行中</span>
    </div>
    
    <div class="container">
        <div class="maintenance-icon">
            <i class="fas fa-cog gear"></i>
            <i class="fas fa-tools"></i>
            <i class="fas fa-cog gear"></i>
        </div>
        
        <h1>网站维护中</h1>
        
        <p>为了给您提供<span class="highlight">更好的服务体验</span>，我们正在对网站进行升级维护。在此期间，网站将暂时无法访问。</p>
        <p>我们正在努力完成维护工作，预计将在 <span class="highlight">33550336 年</span> 内恢复服务。感谢您的理解与支持！</p>
        
        <div class="progress-container">
            <div class="progress-label">
                <span>维护进度</span>
                <span>75%</span>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
        
        <div class="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="hours">02</div>
                <div class="countdown-label">小时</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">45</div>
                <div class="countdown-label">分钟</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">18</div>
                <div class="countdown-label">秒</div>
            </div>
        </div>
        
        <div class="contact-info">
            <h2><i class="fas fa-life-ring"></i> 需要帮助？</h2>
            <p>如果您有紧急需求或任何疑问，请通过以下方式联系我们：</p>
            
            <div class="contact-details">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>support@techcorp.com</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone-alt"></i>
                    <span>400-123-4567</span>
                </div>
            </div>
        </div>
        
        <div class="social-links">
            <a href="#" class="social-icon">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-icon">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="social-icon">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-icon">
                <i class="fab fa-linkedin-in"></i>
            </a>
        </div>
    </div>
    
    <script>
        // 倒计时功能
        function updateCountdown() {
            const hoursElement = document.getElementById('hours');
            const minutesElement = document.getElementById('minutes');
            const secondsElement = document.getElementById('seconds');
            
            let hours = parseInt(hoursElement.textContent);
            let minutes = parseInt(minutesElement.textContent);
            let seconds = parseInt(secondsElement.textContent);
            
            if (seconds > 0) {
                seconds--;
            } else {
                seconds = 59;
                if (minutes > 0) {
                    minutes--;
                } else {
                    minutes = 59;
                    if (hours > 0) {
                        hours--;
                    } else {
                        // 倒计时结束
                        clearInterval(countdownInterval);
                        return;
                    }
                }
            }
            
            hoursElement.textContent = hours.toString().padStart(2, '0');
            minutesElement.textContent = minutes.toString().padStart(2, '0');
            secondsElement.textContent = seconds.toString().padStart(2, '0');
        }
        
        // 启动倒计时
        const countdownInterval = setInterval(updateCountdown, 1000);
        
        // 进度条动画
        const progress = document.querySelector('.progress');
        let width = 75;
        
        function animateProgress() {
            if (width < 95) {
                width += 0.1;
                progress.style.width = width + '%';
            }
        }
        
        // 启动进度条动画
        setInterval(animateProgress, 3000);
    </script>
</body>
</html>
